# Builds the road packs of the whole world on GitHub's machines and publishes them as one release.
# Monthly by itself; by hand under Actions → Build road packs (single packs: ids from countries.py).
name: Build road packs

on:
  workflow_dispatch:
    inputs:
      packs:
        description: "Pack ids, comma separated (empty: the whole world)"
        required: false
        default: ""
      publish:
        description: "Publish a release and the manifest"
        type: boolean
        default: true
  schedule:
    - cron: "0 3 7 * *"

permissions:
  contents: write

concurrency:
  group: road-data
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      date: ${{ steps.plan.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          PACKS: ${{ inputs.packs }}
        run: |
          echo "matrix=$(python3 countries.py --matrix "$PACKS")" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Kind to Geofabrik: a few downloads at a time.
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Room for the large extracts
        if: ${{ matrix.large }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          osmium --version | head -1
      - name: Work space
        run: |
          sudo mkdir -p /mnt/work
          sudo chown "$(id -u):$(id -g)" /mnt/work
          df -h / /mnt
      - name: Download
        working-directory: /mnt/work
        env:
          URLS: ${{ matrix.urls }}
        run: |
          n=0
          for url in $URLS; do
            curl -fsSL --retry 5 --retry-delay 60 --retry-all-errors -o "extract-$n.osm.pbf" "$url"
            n=$((n + 1))
          done
          ls -la
      - name: Build
        working-directory: /mnt/work
        run: |
          python3 "$GITHUB_WORKSPACE/build_pack.py" "${{ matrix.id }}" "${{ needs.plan.outputs.date }}" extract-*.osm.pbf
          rm -rf work extract-*.osm.pbf
          python3 "$GITHUB_WORKSPACE/read_pack.py" "dist/roads-${{ matrix.id }}-v1.bin" | head -5 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.id }}
          path: /mnt/work/dist/roads-${{ matrix.id }}-v1.bin
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [plan, build]
    # Packs that failed keep their published version; the others go out.
    if: ${{ always() && needs.plan.result == 'success' && (github.event_name == 'schedule' || inputs.publish) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pack-*
          path: dist
          merge-multiple: true
      - name: Release and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          python3 publish.py --dist dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Data ${{ needs.plan.outputs.date }}"
            git push origin HEAD:main
          fi
